<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>lanny</title>
        <link rel="stylesheet" href="style.css" />
        <script src="js/main.js"></script>
    </head>
    <body>
        <div class="overlay" id="overlay">
            <div class="overlay-circle"></div>
            <div class="top-corner-notes overlay-notes">
                <div class="red-dot-label">Notes</div>
                <div class="red-dot" id="redDotOverlay"></div>
            </div>
            <div class="overlay-content">
                <div class="notes-wrapper">
                    <div class="notes-pagination" id="notesPagination">
                        <span class="notes-arrow" id="notesPrev">&#8592;</span>
                        <span class="notes-page" id="notesPageNum">1</span>
                        <span class="notes-arrow" id="notesNext">&#8594;</span>
                    </div>
                    <div class="notes-input-row">
                        <input class="notes-input" id="notesInput" type="text" placeholder="write your thoughts" autocomplete="off" />
                        <button class="notes-post-btn" id="notesPostBtn">POST</button>
                    </div>
                    <div class="notes-list" id="notesList"></div>
                </div>
            </div>
        </div>

        <section class="top-section">
            <div class="top-corner-notes" id="heroNotes">
                <div class="red-dot-label">Notes</div>
                <div class="red-dot" id="redDot"></div>
            </div>

            <div class="top-content">
                <h1 class="nick">lanny.dev</h1>
                <p class="tagline">developer & music enthusiast</p>
                <p class="info-text">🎹 chopin & beethoven</p>

                <nav class="socials">
                    <a href="https://github.com/Luminate-D" class="social-link" title="GitHub">
                        GitHub
                    </a>
                    <a href="https://discord.com/users/974442399197712384" class="social-link" title="Discord">
                        Discord
                    </a>
                    <a href="https://t.me/lannts" class="social-link" title="Telegram">
                        Telegram
                    </a>
                </nav>

                <div class="audio-section">
                    <div class="audio-player">
                        <button class="play-btn" id="playBtn">▶</button>
                        <div class="progress-container">
                            <div class="progress-bar" id="progressBar"></div>
                        </div>
                        <span class="time-display" id="timeDisplay">0:00</span>
                    </div>
                    <audio id="audioPlayer" src="assets/appassionata_3rd.mp3"></audio>
                    <p class="audio-label">today's feeling</p>
                </div>
            </div>
        </section>

        <section class="projects">
            <h2>Projects</h2>
            <div class="projects-grid">
                :)
<!--                <a href="https://example.com" class="project-card">-->
<!--                    <h3 class="project-title">Hubble Horizon</h3>-->
<!--                    <p class="project-description">2D demo display of Universe expansion and Hubble Sphere</p>-->
<!--                </a>-->
            </div>
        </section>

        <footer class="footer">
            <p>From <span class="tonality" data-sound="Cm.mp3">C minor</span>'s fire to <span class="tonality" data-sound="Csm.mp3">C# minor</span>'s quiet depth · <span id="year">forever</span></p>
        </footer>
    </body>
</html>
